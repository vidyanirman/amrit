<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050907"><title>Launch Checklist | AS Digital Graphics</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#050907;color:#e7f4eb;font-family:Poppins,Arial,sans-serif}a{color:inherit}.top{position:sticky;top:0;z-index:5;background:rgba(5,12,8,.96);border-bottom:1px solid #245333;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(14px)}.brand{font-weight:900;letter-spacing:.08em;color:#bbf7d0;text-decoration:none}.back{padding:10px 15px;border-radius:10px;background:#14532d;color:white;text-decoration:none;font-size:13px;font-weight:800}.wrap{max-width:1050px;margin:55px auto;padding:0 22px}.eyebrow{color:#4ade80;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.hero{padding:35px;border:1px solid #245333;border-radius:25px;background:radial-gradient(circle at 90% 0%,#123c25,transparent 45%),linear-gradient(140deg,#0c1d12,#060b08);box-shadow:0 22px 70px #0008}.hero h1{font-size:clamp(32px,6vw,55px);line-height:1.05;margin:13px 0;color:#f0fdf4}.hero p,.muted{color:#a8b8ac;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:25px}.card{padding:22px;border:1px solid #245333;border-radius:18px;background:linear-gradient(145deg,#102117,#08100b)}.card h3{margin:0 0 8px;color:#d9fbe2}.card p{color:#9eb3a4;line-height:1.7;font-size:14px}.btn,button{border:0;display:inline-block;padding:12px 17px;border-radius:10px;background:linear-gradient(110deg,#15803d,#22c55e);color:#041108;font-weight:900;text-decoration:none;cursor:pointer}.field{display:grid;gap:7px;margin:12px 0;color:#cfe4d5;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #315a3d;border-radius:10px;background:#07110b;color:#fff;font:inherit}.output{white-space:pre-wrap;padding:15px;border-radius:12px;background:#030805;border:1px solid #245333;color:#d1fae5;margin-top:15px}.swatches{display:flex;gap:7px;margin:18px 0}.swatches i{height:65px;flex:1;border-radius:9px;border:1px solid #ffffff30}.check{display:flex;gap:10px;margin:12px 0;color:#cfe4d5}.check input{accent-color:#22c55e}.foot{margin:40px 0 20px;text-align:center;color:#718779;font-size:12px}@media(max-width:600px){.hero{padding:23px}.top{padding:13px 17px}}
</style></head><body><header class="top"><a class="brand" href="index.html">AS DIGITAL GRAPHICS</a><a class="back" href="index.html">← Back to Home</a></header><main class="wrap"><section class="hero"><span class="eyebrow">PROJECT READINESS · FINAL REVIEW</span><h1>Launch Checklist</h1><p>Tick off the essentials before sending your design request.</p><div id="checks"><label class="check"><input type="checkbox"> I have finalised the project title and text.</label><label class="check"><input type="checkbox"> I have selected the required dimensions.</label><label class="check"><input type="checkbox"> I have collected reference images or examples.</label><label class="check"><input type="checkbox"> I have selected preferred colours and style.</label><label class="check"><input type="checkbox"> I have prepared logos, photos and other assets.</label><label class="check"><input type="checkbox"> I have checked spelling and contact details.</label></div><p class="muted" id="progress">0 of 6 complete</p><div style="height:8px;background:#1b2b20;border-radius:20px;overflow:hidden"><div id="bar" style="height:8px;width:0;background:#22c55e"></div></div><script>const cs=[...document.querySelectorAll('#checks input')];function up(){let n=cs.filter(x=>x.checked).length;progress.textContent=n+' of 6 complete';bar.style.width=(n/6*100)+'%'}cs.forEach(x=>x.addEventListener('change',up))</script></section><p class="foot">© AS Digital Graphics · Created by Amrit Singh</p></main></body></html>
