</style></head><body><header class="top"><a class="brand" href="index.html">AS DIGITAL GRAPHICS</a><a class="back" href="index.html">← Back to Home</a></header><main class="wrap"><section class="hero"><span class="eyebrow">START A PROJECT · BOOKING</span><h1>Project Booking Desk</h1><p>Tell us what you want to create. Your details will be prepared in a WhatsApp message to the studio.</p><form id="booking"><label class="field">Your name<input id="name" required placeholder="Enter your name"></label><label class="field">Select service<select id="service"><option>Poster / Banner Design</option><option>Logo & Branding</option><option>Social Media Creative</option><option>YouTube Thumbnail</option><option>Photo Editing</option><option>Video Editing</option><option>Other</option></select></label><label class="field">Project details<textarea id="details" rows="4" placeholder="Describe your requirements..."></textarea></label><button>Send Booking Request</button></form><script>document.getElementById('booking').addEventListener('submit',e=>{e.preventDefault();let m='Hello AS Digital Graphics!%0AName: '+encodeURIComponent(document.getElementById('name').value)+'%0AService: '+encodeURIComponent(document.getElementById('service').value)+'%0ADetails: '+encodeURIComponent(document.getElementById('details').value);window.open('https://wa.me/919277138739?text='+m,'_blank')})</script></section><p class="foot">© AS Digital Graphics · Created by Amrit Singh</p></main></body></html>
