<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050907">
<title>Founders Gallery | AS Digital Graphics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050907;--green:#22c55e;--muted:#9aafa0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#10351e 0,transparent 42%),var(--bg);color:#e7f4eb;font-family:Poppins,Arial,sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:15px 5%;background:#050c08ed;border-bottom:1px solid #244b32;backdrop-filter:blur(15px)}
.brand{font-size:13px;font-weight:900;letter-spacing:.12em;color:#bbf7d0;text-decoration:none}.back{padding:10px 15px;border-radius:10px;background:#14532d;font-size:12px;font-weight:800;color:#f0fdf4;text-decoration:none}
.wrap{width:min(1120px,100%);margin:auto;padding:54px 22px 70px}.hero{text-align:center;padding:40px 20px 34px}.kicker{color:#4ade80;font-size:10px;font-weight:900;letter-spacing:.24em}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.08;letter-spacing:-.055em;margin:13px 0;color:#f0fdf4}.hero h1 span{color:#86efac}.hero p{max-width:560px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.8}
figure{margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tile{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid #4ade8038;border-radius:20px;background:linear-gradient(145deg,#102719,#050a07);box-shadow:0 15px 42px #0008;animation:appear .45s ease both}.tile img{width:100%;height:100%;aspect-ratio:1 / 1;display:block;object-fit:cover;cursor:zoom-in;transition:transform .45s}.tile:hover img{transform:scale(1.045)}
/* Missing images are marked clearly instead of showing broken-image icons. */
.tile{background:linear-gradient(145deg,#102719,#050a07)}
.tile img{position:relative}
.tile img.is-missing{visibility:hidden}
.tile .missing-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;color:#9aafa0;font-size:12px;line-height:1.7}
.tile:has(img:not(.is-missing)) .missing-note{display:none}
.viewer{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#000e;backdrop-filter:blur(12px)}.viewer.open{display:flex}.viewer img{width:min(90vw,680px);aspect-ratio:1;object-fit:contain;border-radius:16px}.close{position:absolute;right:22px;top:18px;width:42px;height:42px;border:1px solid #4ade8055;border-radius:50%;background:#102016;color:white;font-size:24px;cursor:pointer}
footer{text-align:center;color:#718779;font-size:10px;padding:24px;border-top:1px solid #173322}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrap{padding:28px 14px 50px}.tile{border-radius:14px}}
@media(max-width:420px){.grid{gap:9px}.top{padding:12px}.brand{font-size:10px}.back{font-size:10px;padding:9px 11px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">AS DIGITAL GRAPHICS</a><a class="back" href="index.html">← Back to Home</a></header>
<main class="wrap">
<section class="hero"><span class="kicker">A VISUAL COLLECTION</span><h1>Founders <span>Gallery</span></h1><p>A collection of photographs in a clean square format.</p></section>

<!--
  PHOTO SETUP:
  Keep this HTML file and an "images" folder together.
  Put your JPG/PNG photos inside images/.
  Update the src filename for each photo below.
  Example: images/amrit-singh.jpg
  Add or remove figure blocks as needed. Each photo must have its own unique filename.
-->
<section class="grid" id="gallery" aria-label="Photo gallery">
  <figure class="tile"><img src="amrit-singh.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="amrit2.jpeg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="amrit3.jpeg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="amrit4.jpeg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="amrit5.jpeg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-6.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-7.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-8.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-9.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-10.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-11.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-12.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-9.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-10.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-11.jpg" alt="Gallery photograph" loading="lazy"></figure>
  <figure class="tile"><img src="images/photo-12.jpg" alt="Gallery photograph" loading="lazy"></figure>
</section>
</main>
<div class="viewer" id="viewer" aria-hidden="true"><button class="close" id="close" aria-label="Close">×</button><img id="viewerImg" alt="Gallery photograph"></div>
<footer>© AS Digital Graphics</footer>
<script>
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');

document.querySelectorAll('.tile img').forEach((img) => {
  const tile = img.closest('.tile');
  const note = document.createElement('div');
  note.className = 'missing-note';
  note.textContent = 'Photo not found\\nCheck this image filename';
  tile.appendChild(note);

  const markLoaded = () => {
    img.classList.remove('is-missing');
    note.style.display = 'none';
  };
  const markMissing = () => {
    img.classList.add('is-missing');
    note.style.display = 'flex';
  };

  img.addEventListener('load', markLoaded);
  img.addEventListener('error', markMissing);
  if (img.complete) {
    img.naturalWidth ? markLoaded() : markMissing();
  }

  img.addEventListener('click', () => {
    if (!img.complete || !img.naturalWidth) return;
    viewerImg.src = img.currentSrc || img.src;
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden', 'false');
  });
});

function closeViewer() {
  viewer.classList.remove('open');
  viewer.setAttribute('aria-hidden', 'true');
  viewerImg.src = '';
}
document.getElementById('close').addEventListener('click', closeViewer);
viewer.addEventListener('click', (event) => {
  if (event.target === viewer) closeViewer();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeViewer();
});
</script>
</body></html>
